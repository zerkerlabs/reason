[package]
name = "zerker-reason"
version = "0.1.0"
edition = "2024"
description = "A trustworthy neuro-symbolic reasoning coprocessor for agents"
license = "Apache-2.0"

[[bin]]
name = "reason"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
