name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Require tag and package version alignment
        run: |
          set -euo pipefail
          VERSION="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version $VERSION"
            exit 1
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --locked --all-targets --all-features

      - name: Build validation binary
        run: cargo build --release --locked --bin reason

      - name: Replay authorization conformance corpus
        run: python3 scripts/check-conformance.py --reason "$PWD/target/release/reason"

      - name: Check certificate-backed website
        run: npm --prefix website run check

      - name: Verify crate package
        run: cargo package --locked

  build:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-14
            target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --bin reason --target "${{ matrix.target }}"

      - name: Package and smoke test
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          ARCHIVE="zerker-reason-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          mkdir -p package/scripts
          cp "target/${TARGET}/release/reason" README.md LICENSE package/
          cp -R schemas package/schemas
          cp -R conformance package/conformance
          cp scripts/check-conformance.py package/scripts/
          package/reason --version
          tar -czf "$ARCHIVE" -C package reason README.md LICENSE schemas conformance scripts
          shasum -a 256 "$ARCHIVE" >"$ARCHIVE.sha256"

      - name: Upload staged release asset
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-${{ matrix.target }}
          path: |
            zerker-reason-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            zerker-reason-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all staged assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete staged asset set
        working-directory: release-assets
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 4
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l | tr -d ' ')" = 4
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done

      - name: Create draft, upload complete set, and publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes "${prerelease[@]}"
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz ./*.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
