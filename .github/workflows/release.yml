name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes "${prerelease[@]}"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-14
            target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --bin reason --target "${{ matrix.target }}"

      - name: Package binary
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          ARCHIVE="zerker-reason-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          mkdir package
          cp "target/${TARGET}/release/reason" README.md LICENSE package/
          tar -czf "$ARCHIVE" -C package reason README.md LICENSE
          shasum -a 256 "$ARCHIVE" >"$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >>"$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
